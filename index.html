<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Shows and Movies Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
        }
        
        /* Darker/Charcoal Top Header Section */
        .top-header-wrapper {
            background-color: #0a0a0a;
            border-bottom: 1px solid #222222;
            padding: 15px 25px;
            width: 100%;
            box-sizing: border-box;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 100%;
            margin: 0;
            position: relative;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Main Content Container wrapper */
        .main-content {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
        
        /* Logo PNG Container / Image Styling */
        .logo-container {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .logo-img {
            height: 75px;
            width: auto;
            object-fit: contain;
            display: block;
        }

        /* Navigation Links */
        .nav-link {
            background: none;
            border: none;
            color: #aaaaaa;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 20px;
            transition: color 0.2s, background-color 0.2s;
        }
        .nav-link:hover, .nav-link.active-nav {
            color: #ffffff;
            background-color: #1a1a1a;
        }
        
        /* Search Bar Styling */
        .search-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        #search-input {
            width: 220px;
            padding: 10px 15px;
            padding-right: 35px;
            background-color: #161616;
            border: 1px solid #333333;
            border-radius: 20px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: width 0.3s ease, border-color 0.3s ease;
        }
        #search-input:focus {
            width: 280px;
            border-color: #777777;
        }
        .search-icon {
            position: absolute;
            right: 12px;
            width: 16px;
            height: 16px;
            fill: #777777;
            pointer-events: none;
        }

        /* Views management - Strictly separated sections */
        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }

        /* Search View UI Header */
        .search-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #222222;
        }
        .search-title-wrap {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }
        .search-query-text {
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            margin: 0;
        }
        .search-count {
            color: #777777;
            font-size: 14px;
            font-weight: normal;
        }
        .clear-search-btn {
            background-color: #1a1a1a;
            color: #aaaaaa;
            border: 1px solid #333333;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .clear-search-btn:hover {
            background-color: #262626;
            color: #ffffff;
            border-color: #555555;
        }

        /* HUGE HERO BANNER STYLING */
        .hero-banner {
            position: relative;
            width: 100%;
            height: 480px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 35px;
            background-color: #111111;
            border: 1px solid #222222;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            display: flex;
            align-items: flex-end;
        }
        .hero-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.85);
            transition: opacity 0.5s ease;
        }
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.3) 60%, transparent 100%),
                        linear-gradient(to right, rgba(0,0,0,0.7) 0%, transparent 60%);
        }
        .hero-content {
            position: relative;
            z-index: 2;
            padding: 40px;
            max-width: 650px;
        }
        .hero-badge {
            display: inline-block;
            background-color: #ffffff;
            color: #000000;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 4px;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        .hero-title {
            font-size: 38px;
            font-weight: 800;
            color: #ffffff;
            margin: 0 0 12px 0;
            line-height: 1.15;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        .hero-meta {
            display: flex;
            gap: 12px;
            font-size: 13px;
            font-weight: bold;
            color: #cccccc;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .hero-description {
            font-size: 14px;
            color: #dddddd;
            line-height: 1.5;
            margin-bottom: 25px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .hero-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .hero-btn-play {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(255,255,255,0.2);
            transition: transform 0.2s, background-color 0.2s;
        }
        .hero-btn-play:hover {
            background-color: #e0e0e0;
            transform: scale(1.04);
        }
        .hero-btn-play svg {
            width: 14px;
            height: 14px;
            fill: #000000;
        }
        
        .hero-btn-add {
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s, transform 0.2s;
        }
        .hero-btn-add:hover {
            background-color: rgba(255, 255, 255, 0.25);
            transform: scale(1.04);
        }
        .hero-btn-add svg {
            width: 14px;
            height: 14px;
            stroke: #ffffff;
            stroke-width: 2.5;
            fill: none;
        }

        .section-title {
            font-size: 22px;
            font-weight: bold;
            margin: 0 0 20px 0;
            color: #ffffff;
        }

        /* Anime Grid Container */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .anime-poster-card {
            background-color: #111111;
            border: 1px solid #222222;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            cursor: pointer;
            position: relative;
            height: 320px;
            transition: transform 0.2s ease;
        }
        .anime-poster-card:hover {
            transform: translateY(-4px);
        }
        .anime-poster-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: brightness(1);
            transition: filter 0.3s ease;
        }
        .anime-poster-card:hover img {
            filter: brightness(1.05);
        }

        /* Top Right Action Buttons Container on Poster */
        .card-actions-top-right {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .anime-poster-card:hover .card-actions-top-right,
        .btn-add.in-list {
            opacity: 1;
        }

        .btn-play {
            width: 36px;
            height: 36px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
            border: none;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s;
        }
        .btn-play:hover {
            transform: scale(1.1);
            background-color: #cccccc;
        }
        .btn-play svg {
            width: 14px;
            height: 14px;
            fill: #000000;
            margin-left: 2px;
        }

        .btn-add {
            width: 36px;
            height: 36px;
            background-color: rgba(0, 0, 0, 0.85);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s;
        }
        .btn-add:hover {
            transform: scale(1.1);
            background-color: rgba(30, 30, 30, 0.95);
        }
        .btn-add svg {
            width: 14px;
            height: 14px;
            stroke: #ffffff;
            stroke-width: 2.5;
            fill: none;
        }

        .poster-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.7) 50%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .anime-poster-card:hover .poster-overlay {
            opacity: 1;
        }
        .poster-title {
            font-size: 14px;
            font-weight: bold;
            margin: 0 0 5px 0;
            color: #ffffff;
            transform: translateY(10px);
            transition: transform 0.3s ease;
        }
        .anime-poster-card:hover .poster-title {
            transform: translateY(0);
        }
        .poster-metadata {
            display: flex;
            gap: 8px;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: bold;
            transform: translateY(10px);
            transition: transform 0.3s ease 0.05s;
        }
        .anime-poster-card:hover .poster-metadata {
            transform: translateY(0);
        }
        .tag-format { color: #cccccc; }
        .tag-status { color: #888888; }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #888888;
        }
        .empty-state h3 {
            color: #ffffff;
            font-size: 20px;
            margin-bottom: 10px;
        }

        /* Details Modal View */
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: #111111;
            border: 1px solid #333333;
            width: 90%;
            max-width: 700px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 8px 16px rgba(0,0,0,0.8);
        }
        .modal-banner-container {
            width: 100%;
            height: 250px;
            background-color: #1a1a1a;
        }
        .modal-banner {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(1);
        }
        .modal-body {
            display: flex;
            padding: 20px;
            gap: 20px;
            margin-top: -60px;
            position: relative;
        }
        .modal-cover {
            width: 120px;
            height: 170px;
            object-fit: cover;
            border-radius: 6px;
            border: 4px solid #111111;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
            background-color: #222;
        }
        .modal-details {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 50px;
            flex-grow: 1;
        }
        .modal-title {
            font-size: 22px;
            font-weight: bold;
            margin: 0 0 10px 0;
            color: #ffffff;
        }
        .modal-meta-row {
            display: flex;
            gap: 12px;
            font-size: 13px;
            text-transform: uppercase;
            font-weight: bold;
            align-items: center;
            margin-bottom: 15px;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid #444;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .close-btn:hover { background-color: #333333; }

        /* Video Player View */
        #player-view {
            display: none;
            flex-direction: column;
            gap: 20px;
        }
        #player-view.active {
            display: flex;
        }
        .back-home-btn {
            background: none;
            border: none;
            color: #aaaaaa;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            width: fit-content;
        }
        .back-home-btn:hover { color: #ffffff; text-decoration: underline; }

        .player-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 24px;
        }
        @media (max-width: 900px) {
            .player-layout {
                grid-template-columns: 1fr;
            }
        }
        .player-main-col {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .video-player-box {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000000;
            border: 1px solid #222222;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        .video-player-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .servers-bar-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #111111;
            border: 1px solid #222222;
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            overflow-x: auto;
        }
        .servers-bar-label {
            font-size: 13px;
            font-weight: bold;
            color: #aaaaaa;
            text-transform: uppercase;
            white-space: nowrap;
            margin-right: 5px;
        }
        .server-btn {
            background-color: #1a1a1a;
            color: #cccccc;
            border: 1px solid #333333;
            border-radius: 16px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s, border-color 0.2s, color 0.2s;
        }
        .server-btn:hover {
            background-color: #262626;
            color: #ffffff;
        }
        .server-btn.active-server {
            background-color: #ffffff;
            border-color: #ffffff;
            color: #000000;
        }

        .video-description-box {
            background-color: #111111;
            border: 1px solid #222222;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .video-title-header {
            font-size: 20px;
            font-weight: bold;
            margin: 0 0 10px 0;
            color: #ffffff;
        }
        .video-meta-info {
            display: flex;
            gap: 15px;
            font-size: 13px;
            color: #888888;
            margin-bottom: 12px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .video-desc-text {
            font-size: 14px;
            color: #aaaaaa;
            line-height: 1.5;
            margin: 0;
        }

        .episodes-sidebar {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .episodes-sidebar h3 {
            margin: 0 0 5px 0;
            font-size: 18px;
            color: #ffffff;
            border-bottom: 1px solid #222222;
            padding-bottom: 8px;
        }
        .episode-list-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 520px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .episode-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            background: transparent;
            border: 1px solid transparent;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .episode-item:hover {
            background-color: #111111;
            border-color: #222222;
        }
        .episode-item.active-episode {
            background-color: #181818;
            border-color: #333333;
        }
        .episode-thumb {
            width: 100px;
            height: 56px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #222;
            filter: brightness(1);
            flex-shrink: 0;
        }
        .episode-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow: hidden;
        }
        .episode-number {
            font-size: 12px;
            font-weight: bold;
            color: #888888;
            margin: 0;
        }
        .episode-title-text {
            font-size: 13px;
            color: #ffffff;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <div class="top-header-wrapper">
        <header>
            <div class="header-left">
                <div class="logo-container" id="home-logo-btn">
                    <img src="https://github.com/school-rgb/anime-PNG-logo/blob/main/anime.png?raw=true" alt="Anime Logo" class="logo-img">
                </div>
                <button class="nav-link" id="nav-anime-list">Anime List</button>
            </div>
            <div class="header-right">
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Search anime...">
                    <svg class="search-icon" viewBox="0 0 24 24"><path d="M23.5 22l-6.1-6.1c1.4-1.8 2.2-4 2.2-6.4 0-5.8-4.7-10.5-10.5-10.5S-1.4 3.7-1.4 9.5 3.3 20 9.1 20c2.4 0 4.6-.8 6.4-2.2l6.1 6.1 1.9-1.9zm-14.4-4c-4.7 0-8.5-3.8-8.5-8.5s3.8-8.5 8.5-8.5 8.5 3.8 8.5 8.5-3.8 8.5-8.5 8.5z"/></svg>
                </div>
            </div>
        </header>
    </div>

    <div class="main-content">
        <div id="home-view" class="view-section active">
            <div class="hero-banner" id="hero-banner">
                <img id="hero-bg" class="hero-bg-img" src="" alt="Hero Featured Anime">
                <div class="hero-overlay"></div>
                <div class="hero-content">
                    <span class="hero-badge">Featured Anime</span>
                    <h1 class="hero-title" id="hero-title">Featured Title</h1>
                    <div class="hero-meta">
                        <span id="hero-format">TV</span>
                        <span>•</span>
                        <span id="hero-year">2026</span>
                        <span>•</span>
                        <span id="hero-status" style="color:#66bb6a;">AIRING</span>
                    </div>
                    <p class="hero-description" id="hero-desc">Loading featured anime content...</p>
                    <div class="hero-actions">
                        <button class="hero-btn-play" id="hero-play-btn">
                            <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"></polygon></svg>
                            Play Now
                        </button>
                        <button class="hero-btn-add" id="hero-add-btn">
                            <span id="hero-add-icon"></span>
                            <span id="hero-add-text">Add to List</span>
                        </button>
                    </div>
                </div>
            </div>

            <h2 class="section-title">Popular Shows</h2>
            <div id="anime-container" class="anime-grid">Loading anime list...</div>
        </div>

        <div id="search-view" class="view-section">
            <div class="search-header">
                <div class="search-title-wrap">
                    <h2 class="search-query-text" id="search-query-display">Search Results</h2>
                    <span class="search-count" id="search-results-count"></span>
                </div>
                <button class="clear-search-btn" id="clear-search-btn">&times; Clear Search</button>
            </div>
            <div id="search-anime-container" class="anime-grid"></div>
        </div>

        <div id="list-view" class="view-section">
            <h2 class="section-title">My Anime List</h2>
            <div id="user-anime-container" class="anime-grid"></div>
        </div>

        <div id="player-view" class="view-section">
            <button class="back-home-btn" id="back-to-home">
                &larr; Back to Browse
            </button>
            <div class="player-layout">
                <div class="player-main-col">
                    <div class="video-player-box" id="video-frame-wrapper">
                        <iframe id="active-player-iframe" src="" allowfullscreen></iframe>
                    </div>
                    
                    <div class="servers-bar-container" id="servers-bar">
                        <span class="servers-bar-label">Servers:</span>
                    </div>

                    <div class="video-description-box">
                        <h2 class="video-title-header" id="watch-title">Anime Title</h2>
                        <div class="video-meta-info">
                            <span id="watch-format">TV</span>
                            <span id="watch-year">2026</span>
                        </div>
                        <p class="video-desc-text" id="watch-description">Description goes here.</p>
                    </div>
                </div>
                <div class="episodes-sidebar">
                    <h3>Episodes</h3>
                    <div class="episode-list-container" id="episode-list"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" id="close-modal">&times;</button>
            <div class="modal-banner-container">
                <img id="modal-banner-img" class="modal-banner" src="" alt="Hero Banner">
            </div>
            <div class="modal-body">
                <img id="modal-cover-img" class="modal-cover" src="" alt="Cover Poster">
                <div class="modal-details">
                    <h2 id="modal-title-text" class="modal-title"></h2>
                    <div class="modal-meta-row">
                        <span id="modal-type-text" class="tag-format"></span>
                        <span id="modal-status-text" class="tag-status"></span>
                        <span id="modal-season-text" style="color: #cccccc;"></span>
                    </div>
                    <div class="modal-actions">
                        <button class="btn-play" id="modal-play-btn" title="Play Anime">
                            <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"></polygon></svg>
                        </button>
                        <button class="btn-add" id="modal-add-btn" title="Add to List">
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Added multiple alternative streaming services/servers
        const serversList = [
            { 
                name: 'VidFast VC', 
                url: (id, s, e, isMovie) => isMovie ? `https://vidfast.vc/movie/${id}?autoPlay=true` : `https://vidfast.vc/tv/${id}/${s}/${e}?autoPlay=true` 
            },
            { 
                name: 'VidLink',     
                url: (id, s, e, isMovie) => isMovie ? `https://vidlink.pro/movie/${id}` : `https://vidlink.pro/tv/${id}/${s}/${e}` 
            },
           { 
               name: 'VidFast Pro',
               url: (id, s, e, isMovie) => isMovie ? `https://vidfast.pro/movie/${id}` : `https://vidfast.pro/tv/${id}/${s}/${e}` 
           },
           { 
               name: 'vidsrc',     
               url: (id, s, e, isMovie) => isMovie ? `https://vidsrc.to/embed/movie/${id}` : `https://vidsrc.to/embed/tv/${id}/${s}/${e}`  
           },
           { 
              name: 'viduki',    
              url: (id, s, e, isMovie) => isMovie ? `https://viduki.net/1/movie/${id}` : `https://viduki.net/1/tv/${id}/${s}/${e}` 
           }, 
          { 
              name: 'viduki Multi Embeds',     
              url: (id, s, e, isMovie) => isMovie ? `https://viduki.net/3/movie/${id}` : `https://viduki.net/3/tv/${id}/${s}/${e}` 
          },
         { 
              name: 'viduki Premium ',     
              url: (id, s, e, isMovie) => isMovie ? `https://viduki.net/4/movie/${id}` : `https://viduki.net/4/tv/${id}/${s}/${e}`  
        },
        ];

        let currentActiveServerIndex = 0;
        let currentAnimeId = null;
        let currentFormatType = null;
        let currentSelectedEpisode = 1;

        let savedAnimeList = JSON.parse(localStorage.getItem('myAnimeList')) || [];

        function saveAnimeStore() {
            localStorage.setItem('myAnimeList', JSON.stringify(savedAnimeList));
        }

        function isAnimeInList(id) {
            return savedAnimeList.some(item => item.id === id);
        }

        function toggleAnimeInList(animeData) {
            if (isAnimeInList(animeData.id)) {
                savedAnimeList = savedAnimeList.filter(item => item.id !== animeData.id);
            } else {
                savedAnimeList.push(animeData);
            }
            saveAnimeStore();
            updateAllAddButtons(animeData.id);
            if (listView.classList.contains('active')) {
                renderUserAnimeList();
            }
        }

        const homeView = document.getElementById('home-view');
        const searchView = document.getElementById('search-view');
        const listView = document.getElementById('list-view');
        const playerView = document.getElementById('player-view');

        const animeContainer = document.getElementById('anime-container');
        const searchAnimeContainer = document.getElementById('search-anime-container');
        const userAnimeContainer = document.getElementById('user-anime-container');
        const searchInput = document.getElementById('search-input');
        const searchQueryDisplay = document.getElementById('search-query-display');
        const searchResultsCount = document.getElementById('search-results-count');
        const clearSearchBtn = document.getElementById('clear-search-btn');

        const homeLogoBtn = document.getElementById('home-logo-btn');
        const navAnimeListBtn = document.getElementById('nav-anime-list');
        const backToHomeBtn = document.getElementById('back-to-home');
        const serversBar = document.getElementById('servers-bar');

        // Hero Banner Elements
        const heroBg = document.getElementById('hero-bg');
        const heroTitle = document.getElementById('hero-title');
        const heroFormat = document.getElementById('hero-format');
        const heroYear = document.getElementById('hero-year');
        const heroStatus = document.getElementById('hero-status');
        const heroDesc = document.getElementById('hero-desc');
        const heroPlayBtn = document.getElementById('hero-play-btn');
        const heroAddBtn = document.getElementById('hero-add-btn');
        const heroAddIcon = document.getElementById('hero-add-icon');
        const heroAddText = document.getElementById('hero-add-text');

        let featuredAnimeObj = null;

        // Modal Elements
        const modalOverlay = document.getElementById('modal-overlay');
        const closeModalBtn = document.getElementById('close-modal');
        const modalBannerImg = document.getElementById('modal-banner-img');
        const modalCoverImg = document.getElementById('modal-cover-img');
        const modalTitleText = document.getElementById('modal-title-text');
        const modalTypeText = document.getElementById('modal-type-text');
        const modalStatusText = document.getElementById('modal-status-text');
        const modalSeasonText = document.getElementById('modal-season-text');
        const modalPlayBtn = document.getElementById('modal-play-btn');
        const modalAddBtn = document.getElementById('modal-add-btn');

        // Player Elements
        const activePlayerIframe = document.getElementById('active-player-iframe');
        const watchTitle = document.getElementById('watch-title');
        const watchFormat = document.getElementById('watch-format');
        const watchYear = document.getElementById('watch-year');
        const watchDescription = document.getElementById('watch-description');
        const episodeListContainer = document.getElementById('episode-list');

        let currentActiveAnime = null;

        // Navigation controls
        homeLogoBtn.addEventListener('click', () => {
            clearSearch();
            showView('home');
        });

        navAnimeListBtn.addEventListener('click', () => {
            showView('list');
        });

        backToHomeBtn.addEventListener('click', () => {
            showView('home');
        });

        clearSearchBtn.addEventListener('click', () => {
            clearSearch();
            showView('home');
        });

        function clearSearch() {
            searchInput.value = '';
        }

        function showView(viewName) {
            modalOverlay.style.display = 'none';
            homeView.classList.remove('active');
            searchView.classList.remove('active');
            listView.classList.remove('active');
            playerView.classList.remove('active');
            navAnimeListBtn.classList.remove('active-nav');

            if (viewName === 'home') {
                homeView.classList.add('active');
            } else if (viewName === 'search') {
                searchView.classList.add('active');
            } else if (viewName === 'list') {
                listView.classList.add('active');
                navAnimeListBtn.classList.add('active-nav');
                renderUserAnimeList();
            } else if (viewName === 'player') {
                playerView.classList.add('active');
            }
            window.scrollTo(0, 0);
        }

        // SVG helper functions
        function getPlusSvg() {
            return `<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>`;
        }

        function getCheckSvg() {
            return `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
        }

        function setupHeroBanner(anime) {
            featuredAnimeObj = anime;
            heroBg.src = anime.bannerUrl || anime.coverUrl;
            heroTitle.textContent = anime.title;
            heroFormat.textContent = anime.formatType;
            heroYear.textContent = anime.seasonYear || 'N/A';
            heroStatus.textContent = anime.status === 'RELEASING' ? 'Airing' : 'Completed';
            heroDesc.textContent = anime.description;

            updateHeroAddButton();
        }

        function updateHeroAddButton() {
            if (!featuredAnimeObj) return;
            const inList = isAnimeInList(featuredAnimeObj.id);
            heroAddIcon.innerHTML = inList ? getCheckSvg() : getPlusSvg();
            heroAddText.textContent = inList ? 'Added to List' : 'Add to List';
        }

        heroPlayBtn.addEventListener('click', () => {
            if (featuredAnimeObj) {
                openPlayerView(
                    featuredAnimeObj.id,
                    featuredAnimeObj.formatType,
                    featuredAnimeObj.title,
                    featuredAnimeObj.seasonYear,
                    featuredAnimeObj.bannerUrl,
                    featuredAnimeObj.description,
                    featuredAnimeObj.totalEpisodes,
                    featuredAnimeObj.streamingEpisodes
                );
            }
        });

        heroAddBtn.addEventListener('click', () => {
            if (featuredAnimeObj) {
                toggleAnimeInList(featuredAnimeObj);
            }
        });

        function createAnimeCard(anime) {
            const card = document.createElement('div');
            card.className = 'anime-poster-card';
            card.dataset.animeId = anime.id;

            const inList = isAnimeInList(anime.id);

            card.innerHTML = `
                <img src="${anime.coverUrl}" alt="${anime.title}">
                
                <div class="card-actions-top-right">
                    <button class="btn-play" title="Play">
                        <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"></polygon></svg>
                    </button>
                    <button class="btn-add ${inList ? 'in-list' : ''}" title="${inList ? 'Remove from List' : 'Add to List'}">
                        ${inList ? getCheckSvg() : getPlusSvg()}
                    </button>
                </div>

                <div class="poster-overlay">
                    <p class="poster-title">${anime.title}</p>
                    <div class="poster-metadata">
                        <span class="tag-format">${anime.formatType}</span>
                        <span class="tag-status">${anime.seasonYear}</span>
                    </div>
                </div>
            `;

            const btnAdd = card.querySelector('.btn-add');

            card.querySelector('.btn-play').addEventListener('click', (e) => {
                e.stopPropagation();
                openPlayerView(anime.id, anime.formatType, anime.title, anime.seasonYear, anime.bannerUrl, anime.description, anime.totalEpisodes, anime.streamingEpisodes);
            });

            btnAdd.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleAnimeInList(anime);
            });

            card.addEventListener('click', () => {
                currentActiveAnime = anime;
                modalBannerImg.src = anime.bannerUrl;
                modalCoverImg.src = anime.coverUrl;
                modalTitleText.textContent = anime.title;
                modalTypeText.textContent = anime.formatType;
                modalStatusText.textContent = anime.status === 'RELEASING' ? 'Airing' : 'Completed';
                modalSeasonText.textContent = anime.seasonYear;
                
                updateModalAddButton(anime.id);
                modalOverlay.style.display = 'flex';
            });

            return card;
        }

        function updateAllAddButtons(animeId) {
            const cards = document.querySelectorAll(`.anime-poster-card[data-anime-id="${animeId}"]`);
            const inList = isAnimeInList(animeId);

            cards.forEach(card => {
                const btn = card.querySelector('.btn-add');
                if (btn) {
                    btn.classList.toggle('in-list', inList);
                    btn.title = inList ? 'Remove from List' : 'Add to List';
                    btn.innerHTML = inList ? getCheckSvg() : getPlusSvg();
                }
            });

            if (currentActiveAnime && currentActiveAnime.id === animeId) {
                updateModalAddButton(animeId);
            }

            if (featuredAnimeObj && featuredAnimeObj.id === animeId) {
                updateHeroAddButton();
            }
        }

        function updateModalAddButton(animeId) {
            const inList = isAnimeInList(animeId);
            modalAddBtn.classList.toggle('in-list', inList);
            modalAddBtn.title = inList ? 'Remove from List' : 'Add to List';
            modalAddBtn.innerHTML = inList ? getCheckSvg() : getPlusSvg();
        }

        modalAddBtn.addEventListener('click', () => {
            if (currentActiveAnime) {
                toggleAnimeInList(currentActiveAnime);
            }
        });

        function renderUserAnimeList() {
            userAnimeContainer.innerHTML = '';

            if (savedAnimeList.length === 0) {
                userAnimeContainer.innerHTML = `
                    <div class="empty-state">
                        <h3>Your Anime List is Empty</h3>
                        <p>Click the <strong>+</strong> button on any anime poster or hero banner to add it to your list.</p>
                    </div>
                `;
                return;
            }

            savedAnimeList.forEach(anime => {
                const card = createAnimeCard(anime);
                userAnimeContainer.appendChild(card);
            });
        }

        function fetchAnime(searchTerm = '') {
            const isSearchMode = searchTerm.trim().length > 0;
            const targetContainer = isSearchMode ? searchAnimeContainer : animeContainer;
            
            if (isSearchMode) {
                showView('search');
                searchQueryDisplay.textContent = `Results for "${searchTerm}"`;
                searchResultsCount.textContent = 'Searching...';
            }

            targetContainer.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#888;">Loading anime...</p>';

            const query = `
                query ($search: String) {
                    Page(page: 1, perPage: 16) {
                        media(search: $search, type: ANIME, sort: POPULARITY_DESC) {
                            id
                            format
                            status
                            seasonYear
                            description
                            episodes
                            streamingEpisodes {
                                title
                                thumbnail
                            }
                            title {
                                romaji
                                english
                            }
                            coverImage {
                                extraLarge
                            }
                            bannerImage
                        }
                    }
                }
            `;

            const variables = isSearchMode ? { search: searchTerm } : {};

            fetch('https://graphql.anilist.co', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                },
                body: JSON.stringify({ query: query, variables: variables })
            })
            .then(response => response.json())
            .then(data => {
                const animeList = data.data.Page.media;
                targetContainer.innerHTML = ''; 

                if (isSearchMode) {
                    searchResultsCount.textContent = `(${animeList.length} found)`;
                }

                if (animeList.length === 0) {
                    targetContainer.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#888;">No anime found.</p>';
                    return;
                }

                const formattedList = animeList.map(anime => ({
                    id: anime.id,
                    formatType: anime.format,
                    title: anime.title.english || anime.title.romaji,
                    coverUrl: anime.coverImage.extraLarge,
                    bannerUrl: anime.bannerImage || anime.coverImage.extraLarge,
                    status: anime.status,
                    seasonYear: anime.seasonYear ? anime.seasonYear : '',
                    description: anime.description ? anime.description.replace(/<[^>]*>?/gm, '') : 'No description available.',
                    totalEpisodes: anime.episodes || 12,
                    streamingEpisodes: anime.streamingEpisodes || []
                }));

                if (!isSearchMode) {
                    setupHeroBanner(formattedList[0]);
                    formattedList.slice(1).forEach(anime => {
                        const card = createAnimeCard(anime);
                        targetContainer.appendChild(card);
                    });
                } else {
                    formattedList.forEach(anime => {
                        const card = createAnimeCard(anime);
                        targetContainer.appendChild(card);
                    });
                }
            })
            .catch(error => {
                console.error('Error fetching anime data:', error);
                targetContainer.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#888;">Failed to load anime data.</p>';
            });
        }

        modalPlayBtn.addEventListener('click', () => {
            if (currentActiveAnime) {
                modalOverlay.style.display = 'none';
                openPlayerView(
                    currentActiveAnime.id, 
                    currentActiveAnime.formatType,
                    currentActiveAnime.title, 
                    currentActiveAnime.seasonYear, 
                    currentActiveAnime.bannerUrl, 
                    currentActiveAnime.description, 
                    currentActiveAnime.totalEpisodes,
                    currentActiveAnime.streamingEpisodes
                );
            }
        });

        function openPlayerView(anilistId, formatType, title, year, bannerUrl, description, totalEpisodes, streamingEpisodes) {
            showView('player');

            currentAnimeId = anilistId;
            currentFormatType = formatType;
            currentSelectedEpisode = 1;

            watchTitle.textContent = title;
            watchFormat.textContent = formatType;
            watchYear.textContent = year;
            watchDescription.textContent = description;

            renderServersBar();
            loadActiveServerSource();

            episodeListContainer.innerHTML = '';
            
            if (formatType === 'MOVIE') {
                const epItem = document.createElement('div');
                epItem.className = 'episode-item active-episode';
                epItem.innerHTML = `
                    <img class="episode-thumb" src="${bannerUrl}" alt="Movie">
                    <div class="episode-info">
                        <p class="episode-number">Full Movie</p>
                        <p class="episode-title-text">${title}</p>
                    </div>
                `;
                episodeListContainer.appendChild(epItem);
            } else {
                const episodeCount = Math.max(totalEpisodes, streamingEpisodes.length || 12);
                for (let i = 1; i <= episodeCount; i++) {
                    const streamInfo = streamingEpisodes[i - 1] || {};
                    
                    let episodeName = streamInfo.title;
                    if (!episodeName || episodeName.trim() === '') {
                        episodeName = `${title} - Episode ${i}`;
                    }

                    let episodeThumb = streamInfo.thumbnail;
                    if (!episodeThumb || episodeThumb.trim() === '') {
                        episodeThumb = bannerUrl;
                    }

                    const epItem = document.createElement('div');
                    epItem.className = i === 1 ? 'episode-item active-episode' : 'episode-item';
                    epItem.innerHTML = `
                        <img class="episode-thumb" src="${episodeThumb}" alt="Ep ${i}">
                        <div class="episode-info">
                            <p class="episode-number">Episode ${i}</p>
                            <p class="episode-title-text" title="${episodeName}">${episodeName}</p>
                        </div>
                    `;
                    epItem.addEventListener('click', () => {
                        document.querySelectorAll('.episode-item').forEach(el => el.classList.remove('active-episode'));
                        epItem.classList.add('active-episode');
                        currentSelectedEpisode = i;
                        loadActiveServerSource();
                    });
                    episodeListContainer.appendChild(epItem);
                }
            }
        }

        function renderServersBar() {
            serversBar.innerHTML = '<span class="servers-bar-label">Servers:</span>';
            
            serversList.forEach((server, index) => {
                const sBtn = document.createElement('button');
                sBtn.className = index === currentActiveServerIndex ? 'server-btn active-server' : 'server-btn';
                sBtn.textContent = server.name;
                sBtn.addEventListener('click', () => {
                    currentActiveServerIndex = index;
                    document.querySelectorAll('.server-btn').forEach(btn => btn.classList.remove('active-server'));
                    sBtn.classList.add('active-server');
                    loadActiveServerSource();
                });
                serversBar.appendChild(sBtn);
            });
        }

        function loadActiveServerSource() {
            const selectedServer = serversList[currentActiveServerIndex];
            const isMovie = currentFormatType === 'MOVIE';
            const seasonNum = 1; 
            
            const targetUrl = selectedServer.url(currentAnimeId, seasonNum, currentSelectedEpisode, isMovie);
            activePlayerIframe.src = targetUrl;
        }

        fetchAnime();

        let debounceTimer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            const queryText = e.target.value.trim();
            debounceTimer = setTimeout(() => {
                if (queryText.length > 0) {
                    fetchAnime(queryText);
                } else {
                    showView('home');
                }
            }, 350);
        });

        closeModalBtn.addEventListener('click', () => {
            modalOverlay.style.display = 'none';
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.style.display = 'none';
            }
        });
    </script>

</body>
</html>
