<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime Stream Hub</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: #0f0f12;
      color: #ffffff;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Header Navigation Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 36px;
      background-color: rgba(24, 24, 28, 0.95);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid #2a2a30;
      gap: 16px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      color: #ff6b00;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      flex-shrink: 0;
      letter-spacing: 0.5px;
    }

    .nav-home-btn {
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      background: #222226;
      border: 1px solid #2a2a30;
      padding: 6px 16px;
      border-radius: 20px;
      transition: all 0.2s ease;
    }

    .nav-home-btn:hover {
      background: #28282d;
      border-color: #3a3a42;
    }

    /* Search Bar */
    .search-container {
      display: flex;
      align-items: center;
      max-width: 450px;
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 9px 14px;
      border-radius: 4px 0 0 4px;
      border: 1px solid #2a2a30;
      border-right: none;
      background-color: #222226;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }

    .search-input:focus {
      background-color: #28282d;
      border-color: #3a3a42;
    }

    .search-btn {
      background-color: #ff6b00;
      border: 1px solid #ff6b00;
      color: #fff;
      padding: 9px 18px;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.9rem;
    }

    /* Disclaimer / Content Advisory Modal */
    .disclaimer-backdrop {
      display: flex;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.92);
      z-index: 20000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .disclaimer-box {
      background-color: #18181c;
      border: 1px solid #3a3a42;
      border-radius: 8px;
      max-width: 620px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    .disclaimer-header {
      padding: 20px 24px;
      border-bottom: 1px solid #2a2a30;
      background-color: #141417;
    }

    .disclaimer-header h2 {
      margin: 0;
      font-size: 1.35rem;
      color: #ff6b00;
      font-weight: 800;
    }

    .disclaimer-content {
      padding: 20px 24px;
      overflow-y: auto;
      font-size: 0.92rem;
      line-height: 1.6;
      color: #d0d0d8;
      flex: 1;
    }

    .disclaimer-content h3 {
      color: #ffffff;
      font-size: 1.05rem;
      margin-top: 18px;
      margin-bottom: 6px;
      border-bottom: 1px solid #2a2a30;
      padding-bottom: 4px;
    }

    .disclaimer-content p {
      margin: 0 0 12px 0;
    }

    .disclaimer-footer {
      padding: 16px 24px;
      border-top: 1px solid #2a2a30;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #121215;
    }

    .disclaimer-scroll-hint {
      font-size: 0.82rem;
      color: #ffaa33;
      font-weight: 600;
    }

    .btn-disclaimer-ok {
      background-color: #ff6b00;
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-disclaimer-ok:disabled {
      background-color: #3a3a42;
      color: #888888;
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* Huge Featured Hero Banner */
    .huge-hero-container {
      position: relative;
      width: 100%;
      height: 480px;
      background-size: cover;
      background-position: center 20%;
      display: flex;
      align-items: flex-end;
      border-bottom: 1px solid #2a2a30;
      margin-bottom: 30px;
      transition: background-image 0.5s ease-in-out;
    }

    .huge-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, #0f0f12 0%, rgba(15, 15, 18, 0.75) 50%, rgba(15, 15, 18, 0.3) 100%);
    }

    .huge-hero-content {
      position: relative;
      z-index: 2;
      max-width: 1800px;
      width: 100%;
      margin: 0 auto;
      padding: 36px 36px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hero-tag {
      display: inline-block;
      background-color: #ff6b00;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 3px;
      letter-spacing: 1px;
      width: fit-content;
    }

    .huge-hero-title {
      font-size: 2.6rem;
      font-weight: 900;
      margin: 0;
      line-height: 1.1;
      max-width: 800px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    .huge-hero-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #cfcfd6;
    }

    .huge-hero-desc {
      font-size: 0.95rem;
      color: #b0b0ba;
      line-height: 1.5;
      max-width: 700px;
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .huge-hero-actions {
      display: flex;
      gap: 12px;
      margin-top: 6px;
    }

    .btn-hero-watch {
      background-color: #ff6b00;
      color: #ffffff;
      border: none;
      padding: 11px 28px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-hero-watch:hover {
      background-color: #ff8533;
    }

    .btn-hero-info {
      background-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      padding: 11px 22px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-hero-info:hover {
      background-color: rgba(255, 255, 255, 0.25);
    }

    /* Main Container */
    .container {
      padding: 0 36px 60px 36px;
      max-width: 1800px;
      margin: 0 auto;
    }

    /* Category Row Section */
    .category-section {
      margin-bottom: 36px;
    }

    .category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .category-title {
      font-size: 1.25rem;
      font-weight: 800;
      margin: 0;
      color: #ffffff;
      letter-spacing: 0.3px;
    }

    /* Horizontal Scroll Row */
    .row-scroll-container {
      display: flex;
      gap: 18px;
      overflow-x: auto;
      padding-bottom: 12px;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: #2a2a30 #121215;
    }

    .row-scroll-container::-webkit-scrollbar {
      height: 6px;
    }

    .row-scroll-container::-webkit-scrollbar-track {
      background: #121215;
      border-radius: 4px;
    }

    .row-scroll-container::-webkit-scrollbar-thumb {
      background: #2a2a30;
      border-radius: 4px;
    }

    .row-scroll-container::-webkit-scrollbar-thumb:hover {
      background: #3a3a42;
    }

    /* Single Card Styling for Row */
    .card {
      min-width: 185px;
      max-width: 185px;
      background-color: #18181c;
      border: 1px solid #2a2a30;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      overflow: hidden;
      flex-shrink: 0;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #3a3a42;
    }

    .card-thumbnail-wrapper {
      width: 100%;
      padding-top: 150%;
      position: relative;
      background-color: #121215;
    }

    .card-thumbnail-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-info {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .card-title {
      font-size: 0.88rem;
      font-weight: 700;
      margin: 0;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      font-size: 0.78rem;
      font-weight: 600;
      color: #a0a0ab;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Rating Badges */
    .rating-badge {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 3px;
      display: inline-block;
    }

    .badge-mature { background-color: #381216; color: #ff4d4d; }
    .badge-teen { background-color: #332412; color: #ffaa33; }
    .badge-general { background-color: #122c38; color: #33ccff; }

    /* Modal Backdrop */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 9000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-y: auto;
    }

    .hero-modal {
      background-color: #18181c;
      border: 1px solid #2a2a30;
      border-radius: 8px;
      max-width: 950px;
      width: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      margin: auto;
      overflow: hidden;
    }

    .hero-banner {
      width: 100%;
      height: 380px;
      position: relative;
      background-size: cover;
      background-position: center top;
      display: flex;
      align-items: flex-end;
      border-bottom: 1px solid #2a2a30;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, #18181c 5%, rgba(24, 24, 28, 0.4) 60%, transparent 100%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      display: flex;
      gap: 20px;
      padding: 24px 32px;
      align-items: flex-end;
      width: 100%;
    }

    .hero-poster {
      width: 130px;
      height: 190px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #2a2a30;
      flex-shrink: 0;
    }

    .hero-text {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hero-title {
      font-size: 2rem;
      margin: 0;
      font-weight: 800;
      line-height: 1.1;
      color: #ffffff;
    }

    .hero-meta {
      font-size: 0.95rem;
      font-weight: 600;
      color: #a0a0ab;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hero-stats-badge {
      background-color: #222226;
      color: #e0e0e0;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid #2a2a30;
    }

    .hero-body {
      padding: 24px 32px 32px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .hero-description {
      font-size: 0.95rem;
      color: #cccccc;
      line-height: 1.6;
      max-width: 850px;
      margin: 0;
    }

    /* Movies Section inside Modal */
    .movies-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
      background-color: #121215;
      padding: 16px;
      border: 1px solid #2a2a30;
      border-radius: 6px;
    }

    .movies-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0;
    }

    .movies-list {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .movie-card {
      width: 120px;
      flex-shrink: 0;
      cursor: pointer;
      border: 1px solid #2a2a30;
      background: #18181c;
      padding: 6px;
      border-radius: 4px;
    }

    .movie-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 2px;
    }

    .movie-card-title {
      font-size: 0.75rem;
      font-weight: 700;
      margin-top: 6px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hero-actions {
      display: flex;
      gap: 12px;
    }

    .btn-play {
      background-color: #ff6b00;
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 4px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
    }

    .btn-close-modal {
      background-color: #28282d;
      color: #fff;
      border: 1px solid #3a3a42;
      padding: 12px 24px;
      border-radius: 4px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
    }

    /* Player Overlay */
    #watch-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0c0c0e;
      z-index: 9999;
      padding: 20px;
      overflow-y: auto;
    }

    .close-btn {
      position: fixed;
      top: 15px;
      right: 20px;
      background: #222226;
      color: #fff;
      border: 1px solid #3a3a42;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      z-index: 10000;
    }

    .layout-container {
      display: flex;
      gap: 24px;
      max-width: 1600px;
      margin: 40px auto 40px auto;
      align-items: flex-start;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    .iframe-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
    }

    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .box-card {
      background-color: #18181c;
      padding: 16px;
      border-radius: 6px;
      border: 1px solid #2a2a30;
    }

    .box-title {
      margin: 0 0 12px 0;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
    }

    .server-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button.server-btn {
      background-color: #222226;
      color: #fff;
      border: 1px solid #3a3a42;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }

    button.server-btn.active {
      background-color: #ff6b00;
      border-color: #ff6b00;
    }

    .sidebar {
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: #18181c;
      padding: 16px;
      border-radius: 6px;
      border: 1px solid #2a2a30;
      max-height: calc(100vh - 100px);
      position: sticky;
      top: 20px;
    }

    .sidebar-controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    .season-header {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .season-poster {
      width: 45px;
      height: 65px;
      object-fit: cover;
      border-radius: 4px;
      background-color: #121215;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 4px;
      border: 1px solid #3a3a42;
      background-color: #222226;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    .episode-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .episode-item {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 8px;
      background-color: #222226;
      border-radius: 4px;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .episode-item.active {
      border-color: #ff6b00;
      background-color: #28282d;
    }

    .episode-thumb {
      width: 90px;
      height: 50px;
      object-fit: cover;
      border-radius: 3px;
      background-color: #121215;
      flex-shrink: 0;
    }

    .episode-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .episode-number {
      font-size: 0.8rem;
      font-weight: 700;
      color: #ff6b00;
    }

    .episode-name {
      font-size: 0.8rem;
      color: #ffffff;
      word-break: break-word;
    }

    @media (max-width: 900px) {
      .layout-container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        max-height: none;
        position: relative;
        top: 0;
      }
      header {
        flex-direction: column;
        align-items: stretch;
      }
      .huge-hero-container {
        height: 360px;
      }
      .huge-hero-title {
        font-size: 1.8rem;
      }
      .huge-hero-desc {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-left">
      <div class="logo" onclick="loadHomePage()">
        AnimeHub
      </div>
      <button class="nav-home-btn" onclick="loadHomePage()">Home</button>
    </div>
    
    <div class="search-container">
      <input type="text" id="anime-search-input" class="search-input" placeholder="Search anime series or movies..." onkeyup="handleSearchKey(event)" />
      <button class="search-btn" onclick="executeAnimeSearch()">Search</button>
    </div>
  </header>

  <div id="huge-hero" class="huge-hero-container">
    <div class="huge-hero-overlay"></div>
    <div class="huge-hero-content">
      <span class="hero-tag">Featured Spotlight</span>
      <h1 id="huge-hero-title" class="huge-hero-title">Loading Featured Anime...</h1>
      <div class="huge-hero-meta">
        <span id="huge-hero-rating">★ --</span>
        <span id="huge-hero-badge"></span>
      </div>
      <p id="huge-hero-desc" class="huge-hero-desc">Discover top trending series, films, and favorites right here on AnimeHub.</p>
      <div class="huge-hero-actions">
        <button id="huge-hero-watch-btn" class="btn-hero-watch" onclick="openFeaturedWatch()">Watch Now</button>
        <button id="huge-hero-info-btn" class="btn-hero-info" onclick="openFeaturedInfo()">More Details</button>
      </div>
    </div>
  </div>

  <div class="container" id="home-categories-container"></div>

  <div id="hero-backdrop" class="modal-backdrop">
    <div class="hero-modal">
      <div id="hero-banner-bg" class="hero-banner">
        <div class="hero-overlay"></div>
        <div class="hero-content">
          <img id="hero-poster-img" class="hero-poster" src="" alt="Poster" />
          <div class="hero-text">
            <h2 id="hero-title-text" class="hero-title">Anime Title</h2>
            <div class="hero-meta">
              <span id="hero-rating-text">★ 0.0</span>
              <span id="hero-badge-container"></span>
              <span id="hero-seasons-badge" class="hero-stats-badge">-- Seasons</span>
              <span id="hero-episodes-badge" class="hero-stats-badge">-- Episodes</span>
            </div>
          </div>
        </div>
      </div>
      <div class="hero-body">
        <p id="hero-description-text" class="hero-description">Overview goes here...</p>
        
        <div id="movies-section" class="movies-section" style="display: none;">
          <h4 class="movies-title">Related Movies</h4>
          <div id="movies-list" class="movies-list"></div>
        </div>

        <div class="hero-actions">
          <button id="hero-play-btn" class="btn-play" onclick="startWatching()">Watch Now</button>
          <button class="btn-close-modal" onclick="closeHeroModal()">Close</button>
        </div>
      </div>
    </div>
  </div>

  <div id="watch-modal">
    <button class="close-btn" onclick="closePlayer()">Close</button>
    
    <div class="layout-container">
      <div class="main-content">
        <div class="iframe-container">
          <iframe id="stream-iframe" allowfullscreen></iframe>
        </div>

        <div class="box-card">
          <div class="box-title">Select Server</div>
          <div class="server-buttons" id="server-list"></div>
        </div>

        <div class="box-card">
          <h2 id="info-title" style="margin: 0 0 8px 0; font-size: 1.3rem;">Anime Title</h2>
          <p id="info-description" style="margin: 0; font-size: 0.9rem; line-height: 1.5; color: #aaa;">Loading overview...</p>
        </div>
      </div>

      <div class="sidebar">
        <div class="sidebar-controls">
          <div class="season-header">
            <img id="season-poster-img" class="season-poster" src="" alt="Season Poster" />
            <select id="season-select" onchange="onSeasonChange()">
              <option value="1">Season 1</option>
            </select>
          </div>
          <input type="text" id="episode-search" placeholder="Search episodes..." oninput="filterEpisodes()" />
        </div>
        
        <div class="episode-list" id="episode-list"></div>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = '3a73619bbb8fc6d47742d1b5b2b707b5';
    const BASE = 'https://api.themoviedb.org/3';

    /* Disclaimer Logic */
    function checkDisclaimer() {
      const accepted = localStorage.getItem('disclaimerAccepted');
      const modal = document.getElementById('disclaimer-backdrop');
      if (accepted === 'true') {
        modal.style.display = 'none';
      } else {
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      }
    }

    function handleDisclaimerScroll() {
      const content = document.getElementById('disclaimer-content');
      const okBtn = document.getElementById('disclaimer-ok-btn');
      const hint = document.getElementById('disclaimer-scroll-hint');

      if (content.scrollTop + content.clientHeight >= content.scrollHeight - 15) {
        okBtn.disabled = false;
        hint.innerText = 'Thank you for reading!';
        hint.style.color = '#4CAF50';
      }
    }

    function acceptDisclaimer() {
      localStorage.setItem('disclaimerAccepted', 'true');
      const modal = document.getElementById('disclaimer-backdrop');
      modal.style.display = 'none';
      document.body.style.overflow = 'auto';
    }

    checkDisclaimer();
    
    // Categories for Home View
    const CATEGORIES = [
      { name: "Popular This Season", type: "tv", endpoint: "discover/tv", params: "&with_genres=16&with_origin_country=JP&sort_by=popularity.desc&first_air_date.gte=2024-01-01" },
      { name: "Top Airing Anime", type: "tv", endpoint: "discover/tv", params: "&with_genres=16&with_origin_country=JP&sort_by=popularity.desc&with_status=2" },
      { name: "All-Time Favorites", type: "tv", endpoint: "discover/tv", params: "&with_genres=16&with_origin_country=JP&sort_by=vote_average.desc&vote_count.gte=300" },
      { name: "Action Anime", type: "tv", endpoint: "discover/tv", params: "&with_genres=16,10759&with_origin_country=JP&sort_by=popularity.desc" },
      { name: "Anime Movies", type: "movie", endpoint: "discover/movie", params: "&with_genres=16&with_original_language=ja&sort_by=popularity.desc" },
      { name: "Fantasy & Isekai", type: "tv", endpoint: "discover/tv", params: "&with_genres=16,10765&with_origin_country=JP&sort_by=popularity.desc" },
      { name: "Slice of Life & Comedy", type: "tv", endpoint: "discover/tv", params: "&with_genres=16,35&with_origin_country=JP&sort_by=popularity.desc" },
      { name: "Romance Anime", type: "tv", endpoint: "discover/tv", params: "&with_genres=16,10749&with_origin_country=JP&sort_by=popularity.desc" }
    ];

    const ANILIST_POSTER_API = id => `https://ani.pm/api/anime/poster?anilistId=${id}`;

    const POSTER = (p, anilistId = null) => {
      if (anilistId) return ANILIST_POSTER_API(anilistId);
      return p ? `https://image.tmdb.org/t/p/w500${p}` : 'https://via.placeholder.com/500x750?text=No+Poster';
    };

    const BACKDROP = p => p ? `https://image.tmdb.org/t/p/w1280${p}` : 'https://via.placeholder.com/1280x720?text=No+Image';

    const EXCLUDED_RATINGS = ['R', 'NC-17', 'TV-MA' ];
    const TITLE_BLACKLIST = ['bad anime title 1', 'example title to hide'];

    const TV_SOURCES = [
      { name: 'VidLink',     url: (id, s, e, isMovie) => isMovie ? `https://vidlink.pro/movie/${id}` : `https://vidlink.pro/tv/${id}/${s}/${e}` },
      { name: 'VidFast VC', url: (id, s, e, isMovie) => isMovie ? `https://vidfast.vc/movie/${id}?autoPlay=true` : `https://vidfast.vc/tv/${id}/${s}/${e}?autoPlay=true` },
      { name: 'VidKing',     url: (id, s, e, isMovie) => isMovie ? `https://www.vidking.net/embed/movie/${id}` : `https://www.vidking.net/embed/tv/${id}/${s}/${e}` },
      { name: 'VidFast Pro',url: (id, s, e, isMovie) => isMovie ? `https://vidfast.pro/movie/${id}` : `https://vidfast.pro/tv/${id}/${s}/${e}` },
      { name: 'vidsrc',     url: (id, s, e, isMovie) => isMovie ? `https://vidsrc.to/embed/movie/${id}` : `https://vidsrc.to/embed/tv/${id}/${s}/${e}` },
      { name: '2Embed',     url: (id, s, e, isMovie) => isMovie ? `https://www.2embed.cc/embed/${id}` : `https://www.2embed.cc/embedtv/${id}&s=${s}&e=${e}` }
    ];

    let currentAnime = null;
    let selectedMovie = null;
    let featuredAnime = null;
    let currentSourceIndex = 0;
    let currentSeason = 1;
    let currentEpisode = 1;
    let isCurrentMovie = false;
    let currentMovieId = null;
    let allEpisodes = [];
    let seasonDataMap = {};

    async function loadHomePage() {
      document.getElementById('anime-search-input').value = '';
      const homeContainer = document.getElementById('home-categories-container');
      homeContainer.innerHTML = '';

      // Initialize sections for all categories
      CATEGORIES.forEach((cat, idx) => {
        const sec = document.createElement('div');
        sec.className = 'category-section';
        sec.innerHTML = `
          <div class="category-header">
            <h2 class="category-title">${cat.name}</h2>
          </div>
          <div class="row-scroll-container" id="cat-row-${idx}">
            <div style="color: #888; font-size: 0.9rem; padding: 20px 0;">Loading...</div>
          </div>
        `;
        homeContainer.appendChild(sec);
      });

      // Fetch each category in parallel
      CATEGORIES.forEach((cat, idx) => {
        const url = `${BASE}/${cat.endpoint}?api_key=${API_KEY}${cat.params}&include_adult=false`;
        fetchCategoryData(url, idx, cat.type === 'movie');
      });
    }

    async function fetchCategoryData(url, categoryIndex, isMovie = false) {
      const rowContainer = document.getElementById(`cat-row-${categoryIndex}`);
      try {
        const response = await fetch(url);
        const data = await response.json();

        const animeOnly = (data.results || []).filter(item => {
          const isAnimation = item.genre_ids ? item.genre_ids.includes(16) : true;
          const titleLower = (item.name || item.title || '').toLowerCase();
          const notBlacklisted = !TITLE_BLACKLIST.some(blocked => titleLower.includes(blocked.toLowerCase()));

          return isAnimation && notBlacklisted;
        });

        const filteredList = [];
        for (const anime of animeOnly) {
          anime.name = anime.name || anime.title;
          anime._isMovie = isMovie;
          const rating = await fetchContentRating(anime.id, isMovie);
          anime._contentRating = rating;

          const ratingUpper = (anime._contentRating || '').toUpperCase();
          const isBlocked = EXCLUDED_RATINGS.some(excluded => ratingUpper.includes(excluded.toUpperCase()));

          if (!isBlocked) {
            filteredList.push(anime);
          }
        }

        // Set top item of first category as Featured Hero Spotlight
        if (categoryIndex === 0 && filteredList.length > 0 && !featuredAnime) {
          updateHugeHeroBanner(filteredList[0]);
        }

        renderCategoryRow(rowContainer, filteredList);
      } catch (e) {
        console.error('Error fetching category:', e);
        if (rowContainer) {
          rowContainer.innerHTML = '<div style="color: #ff6b00; font-size: 0.85rem;">Failed to load items.</div>';
        }
      }
    }

    function renderCategoryRow(container, list) {
      container.innerHTML = '';
      if (!list || list.length === 0) {
        container.innerHTML = '<div style="color: #888; font-size: 0.85rem; padding: 10px 0;">No items available.</div>';
        return;
      }

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => item._isMovie ? openMovieHeroModal(item) : openHeroModal(item);

        const badgeHtml = createRatingBadgeHtml(item._contentRating);

        card.innerHTML = `
          <div class="card-thumbnail-wrapper">
            <img src="${POSTER(item.poster_path)}" alt="${item.name}" loading="lazy" />
          </div>
          <div class="card-info">
            <h3 class="card-title">${item.name}</h3>
            <div class="card-meta">
              <span>★ ${item.vote_average ? item.vote_average.toFixed(1) : 'N/A'}</span>
              ${badgeHtml}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateHugeHeroBanner(anime) {
      featuredAnime = anime;
      const heroContainer = document.getElementById('huge-hero');
      heroContainer.style.backgroundImage = `url('${BACKDROP(anime.backdrop_path)}')`;

      document.getElementById('huge-hero-title').innerText = anime.name;
      document.getElementById('huge-hero-rating').innerText = `★ ${anime.vote_average ? anime.vote_average.toFixed(1) : 'N/A'}`;
      document.getElementById('huge-hero-badge').innerHTML = createRatingBadgeHtml(anime._contentRating || 'TV-14');
      document.getElementById('huge-hero-desc').innerText = anime.overview || 'Explore details and streaming availability on AnimeHub.';
    }

    function openFeaturedWatch() {
      if (!featuredAnime) return;
      if (featuredAnime._isMovie) {
        startWatchingMovie(featuredAnime);
      } else {
        openHeroModal(featuredAnime).then(() => startWatching());
      }
    }

    function openFeaturedInfo() {
      if (!featuredAnime) return;
      if (featuredAnime._isMovie) {
        openMovieHeroModal(featuredAnime);
      } else {
        openHeroModal(featuredAnime);
      }
    }

    function handleSearchKey(event) {
      if (event.key === 'Enter') {
        executeAnimeSearch();
      }
    }

    async function executeAnimeSearch() {
      const query = document.getElementById('anime-search-input').value.trim();
      if (!query) return;

      const homeContainer = document.getElementById('home-categories-container');
      homeContainer.innerHTML = `
        <div class="category-section">
          <div class="category-header">
            <h2 class="category-title">Search Results for "${query}"</h2>
          </div>
          <div class="row-scroll-container" id="search-results-row">
            <div style="color: #888; font-size: 0.9rem; padding: 20px 0;">Searching...</div>
          </div>
        </div>
      `;

      const searchUrl = `${BASE}/search/tv?api_key=${API_KEY}&query=${encodeURIComponent(query)}&include_adult=false`;
      fetchCategoryData(searchUrl, 'results-row', false);
    }

    async function fetchAniListId(title) {
      const query = `
        query ($search: String) {
          Media (search: $search, type: ANIME) {
            id
          }
        }
      `;
      try {
        const response = await fetch('https://graphql.anilist.co', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ query, variables: { search: title } })
        });
        const data = await response.json();
        return data?.data?.Media?.id || null;
      } catch (e) {
        return null;
      }
    }

    function getEpisodeImage(stillPath) {
      if (stillPath) {
        return `https://image.tmdb.org/t/p/w300${stillPath}`;
      }
      if (currentAnime && currentAnime.backdrop_path) {
        return BACKDROP(currentAnime.backdrop_path);
      }
      return 'https://via.placeholder.com/300x169?text=No+Preview';
    }

    function createRatingBadgeHtml(ratingText) {
      if (!ratingText) return '';
      
      const text = ratingText.toUpperCase();
      let badgeClass = 'badge-general';

      if (text.includes('MA') || text.includes('R') || text.includes('18')) {
        badgeClass = 'badge-mature';
      } else if (text.includes('14') || text.includes('13') || text.includes('PG-13')) {
        badgeClass = 'badge-teen';
      }

      return `<span class="rating-badge ${badgeClass}">${ratingText}</span>`;
    }

    async function fetchContentRating(id, isMovie = false) {
      try {
        const endpoint = isMovie ? `${BASE}/movie/${id}/release_dates?api_key=${API_KEY}` : `${BASE}/tv/${id}/content_ratings?api_key=${API_KEY}`;
        const res = await fetch(endpoint);
        const data = await res.json();
        
        if (isMovie) {
          const usRelease = (data.results || []).find(r => r.iso_3166_1 === 'US');
          if (usRelease && usRelease.release_dates) {
            const cert = usRelease.release_dates.find(d => d.certification);
            return cert ? cert.certification : 'PG-13';
          }
          return 'PG-13';
        } else {
          if (data.results && data.results.length > 0) {
            const ratingObj = data.results.find(r => r.iso_3166_1 === 'US') || 
                              data.results.find(r => r.iso_3166_1 === 'JP') || 
                              data.results[0];
            return ratingObj.rating || 'TV-14';
          }
        }
      } catch (e) {
        console.error('Error fetching rating:', e);
      }
      return isMovie ? 'PG-13' : 'TV-14';
    }

    /* Open Series Menu Modal */
    async function openHeroModal(anime) {
      currentAnime = anime;
      selectedMovie = null;

      const bannerUrl = BACKDROP(anime.backdrop_path);
      const initialPosterUrl = POSTER(anime.poster_path);

      document.getElementById('hero-banner-bg').style.backgroundImage = `url('${bannerUrl}')`;
      document.getElementById('hero-poster-img').src = initialPosterUrl;
      document.getElementById('hero-title-text').innerText = anime.name;
      document.getElementById('hero-rating-text').innerText = `★ ${anime.vote_average ? anime.vote_average.toFixed(1) : 'N/A'}`;
      document.getElementById('hero-badge-container').innerHTML = createRatingBadgeHtml(anime._contentRating || 'TV-14');
      document.getElementById('hero-description-text').innerText = anime.overview || 'No overview available.';
      
      document.getElementById('hero-seasons-badge').innerText = 'Loading...';
      document.getElementById('hero-episodes-badge').innerText = '';

      const playBtn = document.getElementById('hero-play-btn');
      playBtn.onclick = () => startWatching();

      document.getElementById('hero-backdrop').style.display = 'flex';
      document.body.style.overflow = 'hidden';

      fetchAniListId(anime.name).then(aniId => {
        if (aniId) {
          anime._anilistId = aniId;
          document.getElementById('hero-poster-img').src = POSTER(anime.poster_path, aniId);
        }
      });

      await fetchDetailedAnimeInfo(anime);
    }

    /* Open Movie Menu Modal on Movie Click */
    function openMovieHeroModal(movie) {
      selectedMovie = movie;

      const bannerUrl = BACKDROP(movie.backdrop_path);
      const initialPosterUrl = POSTER(movie.poster_path);

      document.getElementById('hero-banner-bg').style.backgroundImage = `url('${bannerUrl}')`;
      document.getElementById('hero-poster-img').src = initialPosterUrl;
      document.getElementById('hero-title-text').innerText = movie.title || movie.name || movie.original_title;
      document.getElementById('hero-rating-text').innerText = `★ ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A'}`;
      document.getElementById('hero-badge-container').innerHTML = createRatingBadgeHtml(movie._contentRating || (movie.adult ? '18+' : 'PG-13'));
      document.getElementById('hero-description-text').innerText = movie.overview || 'No overview available.';
      
      document.getElementById('hero-seasons-badge').innerText = 'Movie';
      document.getElementById('hero-episodes-badge').innerText = movie.release_date ? movie.release_date.split('-')[0] : 'Film';

      document.getElementById('movies-section').style.display = 'none';

      const playBtn = document.getElementById('hero-play-btn');
      playBtn.onclick = () => startWatchingMovie(movie);

      document.getElementById('hero-backdrop').style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    async function fetchDetailedAnimeInfo(anime) {
      try {
        const res = await fetch(`${BASE}/tv/${anime.id}?api_key=${API_KEY}`);
        const fullData = await res.json();

        const validSeasons = (fullData.seasons || []).filter(s => s.season_number > 0);
        const seasonsCount = validSeasons.length;
        const totalEpisodes = fullData.number_of_episodes || validSeasons.reduce((acc, s) => acc + s.episode_count, 0);

        document.getElementById('hero-seasons-badge').innerText = `${seasonsCount} Season${seasonsCount !== 1 ? 's' : ''}`;
        document.getElementById('hero-episodes-badge').innerText = `${totalEpisodes} Episode${totalEpisodes !== 1 ? 's' : ''}`;

        currentAnime.fullDetails = fullData;

        fetchRelatedMovies(anime.name);
      } catch (e) {
        console.error('Error fetching detailed anime info:', e);
      }
    }

    async function fetchRelatedMovies(animeTitle) {
      const moviesSection = document.getElementById('movies-section');
      const moviesList = document.getElementById('movies-list');
      moviesList.innerHTML = '';
      moviesSection.style.display = 'none';

      try {
        const res = await fetch(`${BASE}/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(animeTitle)}&include_adult=false`);
        const data = await res.json();

        const movies = (data.results || []).filter(m => m.original_language === 'ja' || (m.genre_ids && m.genre_ids.includes(16))).slice(0, 5);

        if (movies.length > 0) {
          moviesSection.style.display = 'flex';
          movies.forEach(movie => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.onclick = () => openMovieHeroModal(movie);
            card.innerHTML = `
              <img src="${POSTER(movie.poster_path)}" alt="${movie.title}" />
              <div class="movie-card-title">${movie.title}</div>
            `;
            moviesList.appendChild(card);
          });
        }
      } catch (e) {
        console.error('Error fetching movies:', e);
      }
    }

    function closeHeroModal() {
      document.getElementById('hero-backdrop').style.display = 'none';
      document.body.style.overflow = 'auto';
    }

    async function startWatching() {
      isCurrentMovie = false;
      document.getElementById('hero-backdrop').style.display = 'none';

      currentSeason = 1;
      currentEpisode = 1;

      document.getElementById('info-title').innerText = currentAnime.name;
      document.getElementById('info-description').innerText = currentAnime.overview || 'No description available.';
      document.getElementById('season-poster-img').src = POSTER(currentAnime.poster_path, currentAnime._anilistId);
      document.querySelector('.sidebar').style.display = 'flex';

      document.getElementById('watch-modal').style.display = 'block';
      document.body.style.overflow = 'hidden';

      renderServerButtons();
      await populateSeasonsFromDetails();
      loadEpisodes(currentSeason);
      updateStream();
    }

    function startWatchingMovie(movie) {
      isCurrentMovie = true;
      currentMovieId = movie.id;
      document.getElementById('hero-backdrop').style.display = 'none';

      document.getElementById('info-title').innerText = movie.title || movie.name || movie.original_title;
      document.getElementById('info-description').innerText = movie.overview || 'No description available.';
      document.querySelector('.sidebar').style.display = 'none';

      document.getElementById('watch-modal').style.display = 'block';
      document.body.style.overflow = 'hidden';

      renderServerButtons();
      updateStream();
    }

    function closePlayer() {
      document.getElementById('watch-modal').style.display = 'none';
      document.body.style.overflow = 'auto';
      document.getElementById('stream-iframe').src = '';
    }

    async function populateSeasonsFromDetails() {
      const seasonSelect = document.getElementById('season-select');
      seasonSelect.innerHTML = '';
      seasonDataMap = {};

      const fullData = currentAnime.fullDetails || {};
      const seasons = fullData.seasons ? fullData.seasons.filter(s => s.season_number > 0) : [];

      if (seasons.length === 0) {
        seasonSelect.innerHTML = `<option value="1">Season 1</option>`;
      } else {
        seasons.forEach(s => {
          seasonDataMap[s.season_number] = s;
          const opt = document.createElement('option');
          opt.value = s.season_number;
          opt.innerText = `${s.name || 'Season ' + s.season_number} (${s.episode_count} eps)`;
          seasonSelect.appendChild(opt);
        });
      }
    }

    async function loadEpisodes(seasonNum) {
      const epListContainer = document.getElementById('episode-list');
      epListContainer.innerHTML = 'Loading episodes...';

      if (seasonDataMap[seasonNum] && seasonDataMap[seasonNum].poster_path) {
        document.getElementById('season-poster-img').src = POSTER(seasonDataMap[seasonNum].poster_path);
      } else {
        document.getElementById('season-poster-img').src = POSTER(currentAnime.poster_path, currentAnime._anilistId);
      }

      try {
        const response = await fetch(`${BASE}/tv/${currentAnime.id}/season/${seasonNum}?api_key=${API_KEY}`);
        const data = await response.json();

        allEpisodes = data.episodes || [];
        renderEpisodeList(allEpisodes);
      } catch (e) {
        allEpisodes = Array.from({ length: 24 }, (_, i) => ({
          episode_number: i + 1,
          name: `Episode ${i + 1}`,
          still_path: null
        }));
        renderEpisodeList(allEpisodes);
      }
    }

    function renderEpisodeList(episodes) {
      const container = document.getElementById('episode-list');
      container.innerHTML = '';

      if (episodes.length === 0) {
        container.innerHTML = '<div style="padding:10px; color:#aaa;">No episodes found.</div>';
        return;
      }

      episodes.forEach(ep => {
        const item = document.createElement('div');
        item.className = `episode-item ${ep.episode_number === currentEpisode ? 'active' : ''}`;

        const thumbImg = getEpisodeImage(ep.still_path);

        item.innerHTML = `
          <img class="episode-thumb" src="${thumbImg}" alt="Ep ${ep.episode_number}" />
          <div class="episode-details">
            <span class="episode-number">Episode ${ep.episode_number}</span>
            <span class="episode-name">${ep.name || 'Episode ' + ep.episode_number}</span>
          </div>
        `;

        item.onclick = () => {
          currentEpisode = ep.episode_number;
          renderEpisodeList(allEpisodes);
          updateStream();
        };

        container.appendChild(item);
      });
    }

    function onSeasonChange() {
      currentSeason = parseInt(document.getElementById('season-select').value);
      currentEpisode = 1;
      loadEpisodes(currentSeason);
      updateStream();
    }

    function filterEpisodes() {
      const query = document.getElementById('episode-search').value.toLowerCase();
      const filtered = allEpisodes.filter(ep => 
        ep.episode_number.toString().includes(query) || 
        (ep.name && ep.name.toLowerCase().includes(query))
      );
      renderEpisodeList(filtered);
    }

    function renderServerButtons() {
      const container = document.getElementById('server-list');
      container.innerHTML = '';

      TV_SOURCES.forEach((source, index) => {
        const btn = document.createElement('button');
        btn.className = `server-btn ${index === currentSourceIndex ? 'active' : ''}`;
        btn.innerText = source.name;

        btn.onclick = () => {
          currentSourceIndex = index;
          renderServerButtons();
          updateStream();
        };

        container.appendChild(btn);
      });
    }

    function updateStream() {
      const provider = TV_SOURCES[currentSourceIndex] || TV_SOURCES[0];
      if (isCurrentMovie) {
        document.getElementById('stream-iframe').src = provider.url(currentMovieId, null, null, true);
      } else {
        if (!currentAnime) return;
        document.getElementById('stream-iframe').src = provider.url(currentAnime.id, currentSeason, currentEpisode, false);
      }
    }

    // Initialize application on Home Page
    loadHomePage();
  </script>

</body>
</html>
