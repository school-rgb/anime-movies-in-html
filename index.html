<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Gather</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d0e12;
            --panel-bg: rgba(25, 26, 32, 0.75);
            --panel-hover: rgba(35, 37, 46, 0.85);
            --accent-color: #e50914; /* Red accent */
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --star-color: #f5c518;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header Styling */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 5%;
            border-bottom: 1px solid var(--border-color);
            background: rgba(13, 14, 18, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--text-primary);
            text-transform: uppercase;
            cursor: pointer;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 24px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
        }

        nav a.active, nav a:hover {
            color: var(--text-primary);
        }

        nav a.active::after {
            content: '';
            display: block;
            height: 2px;
            background: var(--text-primary);
            margin-top: 4px;
            border-radius: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
        }

        /* Dedicated Search UI */
        .search-bar {
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            width: 240px;
            max-width: 100%;
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            outline: none;
            font-size: 0.85rem;
            width: 100%;
            padding-left: 8px;
        }

        .search-bar i {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            margin-top: 8px;
            max-height: 360px;
            overflow-y: auto;
            display: none;
            z-index: 1100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
        }

        .search-dropdown.active {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 10px;
        }

        .search-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-item:hover {
            background: var(--panel-hover);
        }

        .search-item img {
            width: 40px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .search-item-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow: hidden;
        }

        .search-item-title {
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .search-item-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Search Results View */
        .search-view-container {
            display: none;
            flex-direction: column;
            gap: 24px;
            padding: 30px 5%;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            min-height: 80vh;
        }

        .search-view-container h2 {
            font-size: 1.5rem;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        /* Main Dashboard Layout */
        .dashboard {
            display: flex;
            flex-direction: column;
            gap: 30px;
            padding: 30px 5%;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* Hero Banner */
        .hero-banner {
            position: relative;
            height: 400px;
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px;
            background-size: cover;
            background-position: center;
            background-color: #16181e;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: background-image 0.5s ease-in-out;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(13,14,18,0.95) 100%);
            z-index: 1;
        }

        .hero-indicators {
            position: absolute;
            top: 24px;
            left: 40px;
            display: flex;
            gap: 8px;
            z-index: 2;
        }

        .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .indicator.active {
            background: var(--text-primary);
            width: 24px;
            border-radius: 4px;
        }

        .hero-details {
            z-index: 2;
        }

        .hero-year {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .hero-title {
            font-size: clamp(1.8rem, 4vw, 2.75rem);
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .hero-meta {
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .hero-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hero-meta i {
            color: var(--star-color);
        }

        .play-hero-btn {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .play-hero-btn:hover {
            background: var(--accent-color);
            border-color: var(--accent-color);
            transform: scale(1.05);
        }

        /* Content Rows */
        .content-row-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .nav-arrows {
            display: flex;
            gap: 8px;
        }

        .arrow-btn {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .arrow-btn:hover {
            background: var(--panel-hover);
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
        }

        .media-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .media-card:hover {
            transform: translateY(-5px);
        }

        .poster-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 2/3;
            border-radius: 14px;
            overflow: hidden;
            background: #16181e;
            border: 1px solid var(--border-color);
        }

        .poster-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .media-title {
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .media-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .media-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .media-meta i.fa-star {
            color: var(--star-color);
        }

        /* Watch Container Layout (Fully Responsive Single Column) */
        .watch-container {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding: 30px 5%;
            flex-direction: column;
            gap: 24px;
        }

        .watch-container.active {
            display: flex;
        }

        .video-player-main {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        /* Server Switcher Bar */
        .server-selector-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 14px;
            overflow-x: auto;
            max-width: 100%;
        }

        .server-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .server-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .server-btn.active, .server-btn:hover {
            background: var(--accent-color);
            color: var(--text-primary);
            border-color: var(--accent-color);
        }

        .yt-player-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .yt-player-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Clean Video Info Section (Only Name & Description) */
        .video-info-section {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .video-main-title {
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            font-weight: 700;
        }

        .video-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
            background: rgba(0,0,0,0.2);
            padding: 14px;
            border-radius: 10px;
        }

        .back-to-home-btn {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
        }

        .back-to-home-btn:hover {
            background: var(--panel-hover);
        }

        /* Screen Breakpoints for Absolute Responsiveness */
        @media (max-width: 900px) {
            header {
                padding: 14px 20px;
            }
            nav {
                display: none;
            }
            .dashboard, .watch-container, .search-view-container {
                padding: 20px 16px;
            }
            .hero-banner {
                height: 300px;
                padding: 20px;
            }
            .play-hero-btn {
                width: 50px;
                height: 50px;
                right: 20px;
                bottom: 20px;
                font-size: 1.1rem;
            }
            .media-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 12px;
            }
        }

        @media (max-width: 480px) {
            .search-bar {
                width: 160px;
            }
            .hero-banner {
                height: 250px;
            }
        }
    </style>
</head>
<body>

    <header id="mainHeader">
        <div class="logo-container">
            <div class="logo" onclick="returnToHome()">Movie Gather</div>
        </div>
        <nav>
            <ul>
                <li><a class="nav-tab active" data-tab="board">Board</a></li>
                <li><a class="nav-tab" data-tab="new">New</a></li>
                <li><a class="nav-tab" data-tab="movies">Movies</a></li>
                <li><a class="nav-tab" data-tab="series">Series</a></li>
            </ul>
        </nav>
        <div class="header-right">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search movies or shows...">
                <div class="search-dropdown" id="searchDropdown"></div>
            </div>
        </div>
    </header>

    <div class="search-view-container" id="searchView">
        <button class="back-to-home-btn" onclick="returnToHome()">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </button>
        <h2 id="searchViewTitle">Search Results</h2>
        <div class="media-grid" id="searchGrid"></div>
    </div>

    <div class="dashboard" id="dashboardView">
        <div class="main-content">
            <div class="hero-banner" id="heroBanner">
                <div class="hero-overlay"></div>
                <div class="hero-indicators" id="heroIndicators"></div>
                <div class="hero-details">
                    <div class="hero-year" id="heroYear">2026</div>
                    <h1 class="hero-title" id="heroTitle">Loading...</h1>
                    <div class="hero-meta">
                        <span><i class="fa-solid fa-user"></i> <span id="heroViews">340</span></span>
                        <span><i class="fa-solid fa-star"></i> <span id="heroRating">4.8</span> IMDb</span>
                    </div>
                </div>
                <button class="play-hero-btn" id="playHeroBtn">
                    <i class="fa-solid fa-play"></i>
                </button>
            </div>

            <div class="content-row-container">
                <div class="section-header">
                    <h3>Trending</h3>
                    <div class="nav-arrows">
                        <button class="arrow-btn" onclick="scrollGrid('trendingGrid', -300)"><i class="fa-solid fa-chevron-left"></i></button>
                        <button class="arrow-btn" onclick="scrollGrid('trendingGrid', 300)"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="media-grid" id="trendingGrid"></div>
            </div>

            <div class="content-row-container">
                <div class="section-header">
                    <h3>New Releases</h3>
                    <div class="nav-arrows">
                        <button class="arrow-btn" onclick="scrollGrid('newGrid', -300)"><i class="fa-solid fa-chevron-left"></i></button>
                        <button class="arrow-btn" onclick="scrollGrid('newGrid', 300)"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="media-grid" id="newGrid"></div>
            </div>
        </div>
    </div>

    <div class="watch-container" id="watchContainer">
        <div class="video-player-main">
            <button class="back-to-home-btn" onclick="closePlayer()">
                <i class="fa-solid fa-arrow-left"></i> Back to Browsing
            </button>

            <div class="server-selector-bar">
                <span class="server-label"><i class="fa-solid fa-server"></i> Servers:</span>
                <button class="server-btn active" onclick="setServer('vidsrc')">VidSrc.to</button>
                <button class="server-btn" onclick="setServer('vidlink')">VidLink.pro</button>
                <button class="server-btn" onclick="setServer('vidfast')">VidFast.pro</button>
                <button class="server-btn" onclick="setServer('vidfastvc')">VidFast.vc</button>
                <button class="server-btn" onclick="setServer('vidcore')">VidCore.net</button>
                <button class="server-btn" onclick="setServer('viduki')">VidUki.net</button>
                <button class="server-btn" onclick="setServer('streamrip')">StreamRip</button>
            </div>

            <div class="yt-player-box" id="ytPlayerBox">
                <iframe id="videoPlayerFrame" src="" allowfullscreen></iframe>
            </div>

            <div class="video-info-section">
                <div class="video-main-title" id="watchTitle">Movie Title</div>
                <div class="video-description" id="watchDescription">
                    Streaming in high definition with pristine surround sound. Enjoy the cinematic masterpiece directly on Movie Gather.
                </div>
            </div>
        </div>
    </div>

    <script>
        const KEY = '3a73619bbb8fc6d47742d1b5b2b707b5';
        const TMDB = 'https://api.themoviedb.org/3';
        const IMGB = 'https://image.tmdb.org/t/p/original';
        const IMGP = 'https://image.tmdb.org/t/p/w500';

        let heroBanners = [];
        let trendingData = [];
        let newData = [];

        let currentHeroIndex = 0;
        let activeTab = "board";
        let searchQuery = "";
        let searchTimeout = null;

        let currentMedia = { id: null, type: 'movie', title: '', overview: '' };
        let activeServer = 'vidsrc';

        const mainHeader = document.getElementById("mainHeader");
        const dashboardView = document.getElementById("dashboardView");
        const watchContainer = document.getElementById("watchContainer");
        const searchView = document.getElementById("searchView");
        const searchGrid = document.getElementById("searchGrid");
        const searchViewTitle = document.getElementById("searchViewTitle");
        
        const heroBanner = document.getElementById("heroBanner");
        const heroIndicators = document.getElementById("heroIndicators");
        const heroYear = document.getElementById("heroYear");
        const heroTitle = document.getElementById("heroTitle");
        const heroViews = document.getElementById("heroViews");
        const heroRating = document.getElementById("heroRating");
        const trendingGrid = document.getElementById("trendingGrid");
        const newGrid = document.getElementById("newGrid");
        const searchInput = document.getElementById("searchInput");
        const searchDropdown = document.getElementById("searchDropdown");
        const playHeroBtn = document.getElementById("playHeroBtn");
        const watchTitle = document.getElementById("watchTitle");
        const videoPlayerFrame = document.getElementById("videoPlayerFrame");
        const watchDescription = document.getElementById("watchDescription");

        async function fetchTMDBData() {
            try {
                const trendingRes = await fetch(`${TMDB}/trending/all/day?api_key=${KEY}`);
                const trendingJson = await trendingRes.json();
                
                const allItems = trendingJson.results
                    .map(item => ({
                        id: item.id,
                        title: item.title || item.name || 'Untitled',
                        poster: item.poster_path ? IMGP + item.poster_path : 'https://via.placeholder.com/500x750?text=No+Image',
                        backdrop: item.backdrop_path ? IMGB + item.backdrop_path : '',
                        rating: item.vote_average ? item.vote_average.toFixed(1) : '4.5',
                        release_date: item.release_date || item.first_air_date || '2026',
                        overview: item.overview || 'No description available.',
                        type: item.media_type === 'tv' ? 'tv' : 'movie',
                        original_language: item.original_language
                    }))
                    .filter(item => item.original_language !== 'ja'); 

                trendingData = allItems.filter(i => i.backdrop !== '');
                heroBanners = trendingData.slice(0, 5);
                newData = [...allItems].reverse();

                initHeroIndicators();
                updateHeroBanner();
                renderGrids();
            } catch (error) {
                console.error("Error fetching TMDB data:", error);
            }
        }

        function initHeroIndicators() {
            heroIndicators.innerHTML = "";
            heroBanners.forEach((_, idx) => {
                const indicator = document.createElement("span");
                indicator.className = `indicator ${idx === currentHeroIndex ? "active" : ""}`;
                indicator.addEventListener("click", () => {
                    currentHeroIndex = idx;
                    updateHeroBanner();
                });
                heroIndicators.appendChild(indicator);
            });
        }

        function updateHeroBanner() {
            if (!heroBanners.length) return;
            const banner = heroBanners[currentHeroIndex];
            heroBanner.style.backgroundImage = `url('${banner.backdrop}')`;
            heroYear.textContent = banner.release_date.split('-')[0];
            heroTitle.textContent = banner.title;
            heroViews.textContent = Math.floor(Math.random() * 400) + 100;
            heroRating.textContent = banner.rating;

            document.querySelectorAll(".indicator").forEach((ind, idx) => {
                ind.classList.toggle("active", idx === currentHeroIndex);
            });
        }

        setInterval(() => {
            if (heroBanners.length > 0) {
                currentHeroIndex = (currentHeroIndex + 1) % heroBanners.length;
                updateHeroBanner();
            }
        }, 6000);

        function renderGrids() {
            let filteredTrending = trendingData;
            let filteredNew = newData;

            if (activeTab === "movies") {
                filteredTrending = filteredTrending.filter(item => item.type === "movie");
                filteredNew = filteredNew.filter(item => item.type === "movie");
            } else if (activeTab === "series") {
                filteredTrending = filteredTrending.filter(item => item.type === "tv");
                filteredNew = filteredNew.filter(item => item.type === "tv");
            }

            trendingGrid.innerHTML = filteredTrending.length ? filteredTrending.map(cardHtml).join('') : '<p style="color:var(--text-secondary)">No results found.</p>';
            newGrid.innerHTML = filteredNew.length ? filteredNew.map(cardHtml).join('') : '<p style="color:var(--text-secondary)">No results found.</p>';
        }

        function cardHtml(item) {
            return `
                <div class="media-card" onclick="openPlayer(${item.id}, '${item.title.replace(/'/g, "\\'")}', '${item.type}', '${item.overview.replace(/'/g, "\\'")}')">
                    <div class="poster-wrapper">
                        <img src="${item.poster}" alt="${item.title}" loading="lazy">
                    </div>
                    <div class="media-title">${item.title}</div>
                    <div class="media-meta">
                        <span><i class="fa-solid fa-star"></i> ${item.rating} IMDb</span>
                    </div>
                </div>
            `;
        }
        
        async function searchTMDB(query) {
            if (!query.trim()) return [];
            try {
                const res = await fetch(`${TMDB}/search/multi?api_key=${KEY}&query=${encodeURIComponent(query)}`);
                const json = await res.json();
                
                return json.results
                    .filter(item => item.media_type === 'movie' || item.media_type === 'tv') 
                    .filter(item => item.original_language !== 'ja') 
                    .map(item => ({
                        id: item.id,
                        title: item.title || item.name || 'Untitled',
                        poster: item.poster_path ? IMGP + item.poster_path : 'https://via.placeholder.com/500x750?text=No+Image',
                        backdrop: item.backdrop_path ? IMGB + item.backdrop_path : '',
                        rating: item.vote_average ? item.vote_average.toFixed(1) : 'NR',
                        release_date: item.release_date || item.first_air_date || 'N/A',
                        overview: item.overview || 'No description available.',
                        type: item.media_type
                    }));
            } catch (error) {
                console.error("Search error:", error);
                return [];
            }
        }

        function renderSearchDropdown(matches) {
            if (!matches || matches.length === 0) {
                searchDropdown.innerHTML = '<div style="padding: 12px; font-size: 0.85rem; color: var(--text-secondary); text-align:center;">No results found</div>';
                searchDropdown.classList.add("active");
                return;
            }

            searchDropdown.innerHTML = matches.slice(0, 6).map(item => `
                <div class="search-item" onclick="openPlayer(${item.id}, '${item.title.replace(/'/g, "\\'")}', '${item.type}', '${item.overview.replace(/'/g, "\\'")}')">
                    <img src="${item.poster}" alt="${item.title}">
                    <div class="search-item-info">
                        <div class="search-item-title">${item.title}</div>
                        <div class="search-item-meta">
                            <span><i class="fa-solid fa-star" style="color:var(--star-color)"></i> ${item.rating}</span>
                            <span>•</span>
                            <span style="text-transform:uppercase;">${item.type}</span>
                        </div>
                    </div>
                </div>
            `).join('');
            searchDropdown.classList.add("active");
        }

        async function openSearchView(query) {
            searchDropdown.classList.remove("active");
            dashboardView.style.display = "none";
            watchContainer.classList.remove("active");
            
            searchViewTitle.textContent = `Search Results for "${query}"`;
            searchView.style.display = "flex";
            searchGrid.innerHTML = '<p style="color:var(--text-secondary)">Searching database...</p>';

            const matches = await searchTMDB(query);

            if (matches.length > 0) {
                searchGrid.innerHTML = matches.map(cardHtml).join('');
            } else {
                searchGrid.innerHTML = '<p style="color:var(--text-secondary)">No results found.</p>';
            }
        }

        searchInput.addEventListener("input", (e) => {
            searchQuery = e.target.value;
            clearTimeout(searchTimeout);
            
            if (!searchQuery.trim()) {
                searchDropdown.classList.remove("active");
                searchDropdown.innerHTML = "";
                return;
            }

            searchTimeout = setTimeout(async () => {
                const results = await searchTMDB(searchQuery);
                renderSearchDropdown(results);
            }, 400); 
        });

        searchInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter" && searchQuery.trim() !== "") {
                clearTimeout(searchTimeout); 
                openSearchView(searchQuery);
            }
        });

        document.addEventListener("click", (e) => {
            if (!e.target.closest(".search-bar")) {
                searchDropdown.classList.remove("active");
            }
        });

        document.querySelectorAll(".nav-tab").forEach(tab => {
            tab.addEventListener("click", (e) => {
                document.querySelectorAll(".nav-tab").forEach(t => t.classList.remove("active"));
                e.target.classList.add("active");
                activeTab = e.target.getAttribute("data-tab");
                renderGrids();
            });
        });

        function scrollGrid(gridId, distance) {
            document.getElementById(gridId).scrollBy({ left: distance, behavior: 'smooth' });
        }

        function openPlayer(id, title, type, overview) {
            currentMedia = { id, type, title, overview };
            watchTitle.textContent = title;
            watchDescription.textContent = overview;
            
            setServer('vidsrc');

            searchDropdown.classList.remove("active");
            
            mainHeader.style.display = "none"; 
            dashboardView.style.display = "none";
            searchView.style.display = "none"; 
            watchContainer.classList.add("active");
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closePlayer() {
            watchContainer.classList.remove("active");
            videoPlayerFrame.src = ""; 
            
            mainHeader.style.display = "flex";
            if (searchViewTitle.textContent.includes("Search Results") && searchQuery.trim() !== "") {
                searchView.style.display = "flex";
            } else {
                dashboardView.style.display = "flex";
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setServer(serverKey) {
            activeServer = serverKey;
            
            document.querySelectorAll(".server-btn").forEach(btn => btn.classList.remove("active"));
            event && event.target && event.target.classList.add("active");

            const { id, type } = currentMedia;
            if (!id) return;

            let embedUrl = "";
            const s = 1, e = 1;

            switch(serverKey) {
                case 'vidsrc':
                    embedUrl = type === 'tv' ? `https://vidsrc.to/embed/tv/${id}/${s}/${e}` : `https://vidsrc.to/embed/movie/${id}`;
                    break;
                case 'vidlink':
                    embedUrl = type === 'tv' ? `https://vidlink.pro/tv/${id}/${s}/${e}` : `https://vidlink.pro/movie/${id}`;
                    break;
                case 'vidfast':
                    embedUrl = type === 'tv' ? `https://vidfast.pro/tv/${id}/${s}/${e}` : `https://vidfast.pro/movie/${id}`;
                    break;
                case 'vidfastvc':
                    embedUrl = type === 'tv' ? `https://vidfast.vc/tv/${id}/${s}/${e}?autoPlay=true` : `https://vidfast.vc/movie/${id}?autoPlay=true`;
                    break;
                case 'vidcore':
                    embedUrl = `https://vidcore.net/movie/${id}?autoPlay=true`;
                    break;
                case 'viduki':
                    embedUrl = `https://viduki.net/1/movie/${id}?color=e50914`;
                    break;
                default: 'streamrip':
                    embedUrl = type === 'tv' ? `https://streamrip.fun/play?type=tv&id=${id}&s=1&ep=1` : `https://streamrip.fun/play?type=movie&id=${id}`;
                    break;
                case embedUrl = `https://vidsrc.to/embed/movie/${id}`;
            }

            videoPlayerFrame.src = embedUrl;
        }

        function returnToHome() {
            if (watchContainer.classList.contains("active")) {
                closePlayer(); 
            } else {
                searchView.style.display = "none";
                dashboardView.style.display = "flex";
                searchInput.value = ""; 
                searchQuery = "";
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        playHeroBtn.addEventListener("click", () => {
            const banner = heroBanners[currentHeroIndex];
            if (banner) {
                openPlayer(banner.id, banner.title, banner.type, banner.overview);
            }
        });

        fetchTMDBData();
    </script>
</body>
</html>
